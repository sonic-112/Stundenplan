name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the manifest version
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/school_planner/manifest.json'))['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$version"
            exit 1
          fi

      - name: Create release (a tag with a hyphen is a pre-release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags="--generate-notes"
          case "$GITHUB_REF_NAME" in
            *-*) flags="$flags --prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --verify-tag $flags
